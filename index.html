
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CardioDoc Lite — Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; }
    body {
      background: #0a0e19;
      color: #e8eef7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
      line-height: 1.5;
    }
    #root { height: 100%; display: flex; flex-direction: column; }

    /* ============ LAYOUT ============ */
    .app-header {
      background: #0f1420;
      border-bottom: 1px solid #1a2540;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .app-header h1 { font-size: 18px; font-weight: 600; }
    .app-header .actions { display: flex; gap: 8px; }

    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      -webkit-overflow-scrolling: touch;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      background: #0f1420;
      padding: 8px;
      border-radius: 10px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: #1a2540;
      color: #8fa0ba;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .tab.active { background: #2f6df6; color: #fff; }

    /* ============ PATIENTS ============ */
    .patient-card {
      background: #1a2438;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      border-left: 3px solid #2f6df6;
      cursor: pointer;
      transition: background 0.2s;
    }
    .patient-card:active { background: #222d3f; }
    .patient-card.selected { background: #1f3050; border-left-color: #39d98a; }

    .patient-name { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .patient-info { font-size: 12px; color: #8fa0ba; line-height: 1.6; }
    .patient-info span { display: block; }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      background: #1e3050;
      color: #dfe7f2;
    }
    .btn.primary { background: #2f6df6; color: #fff; }
    .btn.small { padding: 8px 14px; font-size: 14px; }
    .btn.ghost { background: transparent; border: 1px solid #2a3a55; color: #aebcd2; }

    /* ============ VITALS BLOCK ============ */
    .vitals-section { margin-bottom: 14px; }
    .vitals-section-title { font-size: 11px; color: #6d7f9b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; padding: 0 2px; }

    .vitals {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      background: #0b111c;
      border: 1px solid #1d2a40;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .vitals.single-row { grid-template-columns: 1fr; }

    .vit {
      display: flex;
      flex-direction: column;
      padding: 6px;
      border-radius: 8px;
    }
    .vit.alert .vit-val { color: #ffdf6b; font-weight: 700; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

    .vit-label { font-size: 11px; color: #8fa0ba; margin-bottom: 3px; }
    .vit-val {
      font-family: ui-monospace, "Menlo", monospace;
      font-size: 16.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .vit.bp .vit-val { color: #ff7b6b; }
    .vit.hr .vit-val { color: #39d98a; }
    .vit.rr .vit-val { color: #e8eef7; }
    .vit.spo2 .vit-val { color: #4fc3f7; }

    .vit-edit-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr 1fr;
      gap: 8px;
      background: #0b111c;
      border: 1px solid #1d2a40;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    @media (max-width: 480px) {
      .vit-edit-grid { grid-template-columns: 1fr 1fr; }
    }

    .bp-pair { display: flex; align-items: center; gap: 3px; }
    .bp-slash { color: #5a6b86; font-weight: 700; }

    input, textarea {
      background: #101828;
      border: 1px solid #2a3a55;
      border-radius: 8px;
      color: #e8eef7;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    input:focus, textarea:focus { border-color: #3d5aa5; }
    input::placeholder, textarea::placeholder { color: #5a6b86; }

    label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #8fa0ba; }

    .vit-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

    /* ============ TASKS ============ */
    .tasks { display: flex; flex-direction: column; gap: 6px; }
    .task {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a2438;
      border-radius: 10px;
      padding: 9px 10px;
    }
    .task.urgent { background: #2b1a1a; box-shadow: inset 3px 0 0 #e0564a; }
    .task.done { opacity: 0.55; background: transparent; }
    .task.done .task-title { text-decoration: line-through; }

    .task-check {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid #4a5d7d;
      background: transparent;
      flex-shrink: 0;
      cursor: pointer;
    }
    .task-check.on { background: #39d98a; border-color: #39d98a; }

    .task-title { flex: 1; font-size: 14px; line-height: 1.35; cursor: pointer; }
    .task-pri {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid #3a4a68;
      background: transparent;
      color: #6d7f9b;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }
    .task-pri.on { background: #e0564a; border-color: #e0564a; color: #fff; }

    .task-add { display: flex; gap: 8px; margin-top: 8px; }
    .task-add input { flex: 1; }

    /* ============ TOAST ============ */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e3a2a;
      border: 1px solid #2f6b45;
      color: #a9f0c4;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 13px;
      z-index: 100;
      max-width: 90vw;
    }
    .toast.err { background: #3a1c1c; border-color: #7a3a34; color: #ffb3a6; }

    .empty { text-align: center; color: #6d7f9b; padding: 24px 12px; font-size: 14px; }

    /* ============ SYNC STATUS ============ */
    .sync-status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #2f6df6;
      animation: sync-slide 0.6s ease-in-out;
      z-index: 200;
    }
    @keyframes sync-slide { from { width: 0; } to { width: 100%; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    /* ============================================================
       CardioDoc Lite — Telegram Mini App Version
       Хранилище: Telegram CloudStorage
       ============================================================ */

    // Инициализация Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.setHeaderColor("#0f1420");
    tg.setBackgroundColor("#0a0e19");

    // ============ STORAGE WRAPPER ============
    const st = {
      async get(k) {
        try {
          const val = await tg.CloudStorage.getItem(k);
          return val;
        } catch (e) {
          console.warn("CloudStorage get error:", e);
          return null;
        }
      },
      async set(k, v) {
        try {
          await tg.CloudStorage.setItem(k, v);
          return true;
        } catch (e) {
          console.warn("CloudStorage set error:", e);
          return false;
        }
      },
      async list(prefix) {
        try {
          const keys = await tg.CloudStorage.getKeys();
          return keys.filter(k => k.startsWith(prefix));
        } catch (e) {
          console.warn("CloudStorage list error:", e);
          return [];
        }
      },
    };

    // ============ UTILITIES ============
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const todayKey = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    };
    const nowTime = () => {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    };

    const vitalAlert = (v) => {
      if (!v) return {};
      const hr = parseFloat(v.hr);
      const rr = parseFloat(v.rr);
      const spo2 = parseFloat(v.spo2);
      let sys = NaN;
      if (v.bp) {
        const m = String(v.bp).match(/(\d+)/);
        if (m) sys = parseFloat(m[1]);
      }
      return {
        bp: !isNaN(sys) && (sys < 90 || sys > 180),
        hr: !isNaN(hr) && (hr < 45 || hr > 120),
        rr: !isNaN(rr) && (rr > 24 || rr < 8),
        spo2: !isNaN(spo2) && spo2 < 90,
      };
    };

    // ============ STATE & RENDERING ============
    let state = {
      patients: [],
      tasks: [],
      selected: null,
      tab: "patients", // patients | tasks
      showVitEdit: false,
      vitForm: { sys: "", dia: "", hr: "", rr: "", spo2: "", extra: {} },
      newTaskText: "",
      toasts: [],
    };

    function showToast(msg, isErr = false) {
      const id = uid();
      state.toasts.push({ id, msg, isErr });
      render();
      setTimeout(() => {
        state.toasts = state.toasts.filter(t => t.id !== id);
        render();
      }, 2500);
    }

    async function loadData() {
      const [patsRaw, tasksRaw] = await Promise.all([
        st.get("patients"),
        st.get("tasks"),
      ]);
      try {
        state.patients = patsRaw ? JSON.parse(patsRaw) : [];
      } catch { state.patients = []; }
      try {
        state.tasks = tasksRaw ? JSON.parse(tasksRaw) : [];
      } catch { state.tasks = []; }
      render();
    }

    async function savePatients() {
      const ok = await st.set("patients", JSON.stringify(state.patients));
      if (!ok) showToast("Ошибка сохранения", true);
    }

    async function saveTasks() {
      const ok = await st.set("tasks", JSON.stringify(state.tasks));
      if (!ok) showToast("Ошибка сохранения", true);
    }

    function addPatient() {
      const name = prompt("ФИО пациента:");
      if (!name) return;
      const p = {
        id: uid(),
        name: name.trim(),
        vitals: null,
        notes: "",
        infusions: [],
      };
      state.patients.push(p);
      state.selected = p.id;
      savePatients();
      showToast("Пациент добавлен");
      render();
    }

    function selectPatient(id) {
      state.selected = id;
      state.showVitEdit = false;
      state.tab = "patients";
      render();
    }

    function updatePatientVitals() {
      const pat = state.patients.find(p => p.id === state.selected);
      if (!pat) return;

      const sys = state.vitForm.sys.trim();
      const dia = state.vitForm.dia.trim();
      const bp = sys || dia ? `${sys}${dia ? "/" + dia : ""}` : "";

      pat.vitals = {
        bp: bp,
        hr: state.vitForm.hr.trim(),
        rr: state.vitForm.rr.trim(),
        spo2: state.vitForm.spo2.trim(),
        at: nowTime(),
      };

      savePatients();
      state.showVitEdit = false;
      showToast("Витальные сохранены");
      render();
    }

    function openVitEdit() {
      const pat = state.patients.find(p => p.id === state.selected);
      if (!pat) return;

      const v = pat.vitals || {};
      const [sys, dia] = (v.bp || "").split("/");

      state.vitForm = {
        sys: sys || "",
        dia: dia || "",
        hr: v.hr || "",
        rr: v.rr || "",
        spo2: v.spo2 || "",
        extra: {},
      };
      state.showVitEdit = true;
      render();
    }

    function addTask() {
      if (!state.newTaskText.trim()) return;
      const t = {
        id: uid(),
        text: state.newTaskText.trim(),
        done: false,
        urgent: false,
        patientId: state.selected || null,
      };
      state.tasks.push(t);
      state.newTaskText = "";
      saveTasks();
      showToast("Задача добавлена");
      render();
    }

    function toggleTask(id) {
      const t = state.tasks.find(x => x.id === id);
      if (t) t.done = !t.done;
      saveTasks();
      render();
    }

    function toggleTaskUrgent(id) {
      const t = state.tasks.find(x => x.id === id);
      if (t) t.urgent = !t.urgent;
      saveTasks();
      render();
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(x => x.id !== id);
      saveTasks();
      render();
    }

    function render() {
      const root = document.getElementById("root");
      const pat = state.patients.find(p => p.id === state.selected);

      root.innerHTML = `
        <div class="app-header">
          <h1>CardioDoc Lite</h1>
          <div class="actions">
            <button class="btn small ghost" onclick="app.switchTab('patients')">Пациенты</button>
            <button class="btn small ghost" onclick="app.switchTab('tasks')">Задачи</button>
          </div>
        </div>

        <div class="app-content">
          ${state.tab === "patients" ? renderPatients() : renderTasks()}
          ${state.toasts.map(t => `<div class="toast ${t.isErr ? 'err' : ''}">${t.msg}</div>`).join("")}
        </div>
      `;
    }

    function renderPatients() {
      if (!state.patients.length) {
        return `
          <div class="empty">
            <p>Пациентов нет</p>
            <button class="btn primary" onclick="app.addPatient()" style="margin-top: 12px;">Добавить пациента</button>
          </div>
        `;
      }

      const pat = state.patients.find(p => p.id === state.selected);

      if (!pat) {
        return `
          <div>
            ${state.patients.map(p => `
              <div class="patient-card" onclick="app.selectPatient('${p.id}')">
                <div class="patient-name">${p.name}</div>
                <div class="patient-info">
                  ${p.vitals ? `
                    <span>АД: ${p.vitals.bp || "—"} | ЧСС: ${p.vitals.hr || "—"}</span>
                    <span>ЧД: ${p.vitals.rr || "—"} | SpO₂: ${p.vitals.spo2 || "—"}%</span>
                  ` : `<span>Нет данных</span>`}
                </div>
              </div>
            `).join("")}
            <button class="btn primary" onclick="app.addPatient()" style="margin-top: 12px; width: 100%;">+ Добавить пациента</button>
          </div>
        `;
      }

      const v = pat.vitals || {};
      const al = vitalAlert(v);

      return `
        <div>
          <div class="patient-card" style="cursor: default;">
            <div class="patient-name">${pat.name}</div>
            <button class="btn ghost" onclick="app.selectPatient(null)" style="margin-top: 8px; width: 100%;">← Назад</button>
          </div>

          <div class="vitals-section">
            <div class="vitals-section-title">Витальные показатели</div>
            <div class="vitals">
              <div class="vit bp ${al.bp ? 'alert' : ''}">
                <div class="vit-label">АД</div>
                <div class="vit-val">${v.bp || "—"}</div>
              </div>
              <div class="vit hr ${al.hr ? 'alert' : ''}">
                <div class="vit-label">ЧСС</div>
                <div class="vit-val">${v.hr || "—"}</div>
              </div>
              <div class="vit rr ${al.rr ? 'alert' : ''}">
                <div class="vit-label">ЧД</div>
                <div class="vit-val">${v.rr || "—"}</div>
              </div>
              <div class="vit spo2 ${al.spo2 ? 'alert' : ''}">
                <div class="vit-label">SpO₂</div>
                <div class="vit-val">${v.spo2 || "—"}%</div>
              </div>
            </div>
            ${!state.showVitEdit ? `
              <button class="btn primary" onclick="app.openVitEdit()" style="width: 100%; margin-top: 8px;">Обновить витальные</button>
            ` : `
              <div class="vit-edit-grid">
                <label>
                  АД
                  <div class="bp-pair">
                    <input type="number" placeholder="120" value="${state.vitForm.sys}" 
                      onchange="app.setVitForm('sys', this.value)">
                    <span class="bp-slash">/</span>
                    <input type="number" placeholder="80" value="${state.vitForm.dia}"
                      onchange="app.setVitForm('dia', this.value)">
                  </div>
                </label>
                <label>
                  ЧСС
                  <input type="number" placeholder="72" value="${state.vitForm.hr}"
                    onchange="app.setVitForm('hr', this.value)">
                </label>
                <label>
                  ЧД
                  <input type="number" placeholder="16" value="${state.vitForm.rr}"
                    onchange="app.setVitForm('rr', this.value)">
                </label>
                <label>
                  SpO₂
                  <input type="number" placeholder="97" value="${state.vitForm.spo2}"
                    onchange="app.setVitForm('spo2', this.value)">
                </label>
              </div>
              <div class="vit-actions">
                <button class="btn ghost" onclick="app.cancelVitEdit()">Отмена</button>
                <button class="btn primary" onclick="app.updatePatientVitals()">Сохранить</button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderTasks() {
      const patientTasks = state.tasks.filter(t => !t.patientId || t.patientId === state.selected);
      const doneTasks = patientTasks.filter(t => t.done);
      const activeTasks = patientTasks.filter(t => !t.done);

      return `
        <div class="tasks">
          ${activeTasks.map(t => `
            <div class="task ${t.urgent ? 'urgent' : ''}">
              <input type="checkbox" class="task-check" ${t.done ? 'checked' : ''}
                onchange="app.toggleTask('${t.id}')">
              <div class="task-title">${t.text}</div>
              <button class="task-pri ${t.urgent ? 'on' : ''}" onclick="app.toggleTaskUrgent('${t.id}')">!</button>
              <button class="btn ghost" onclick="app.deleteTask('${t.id}')" style="padding: 4px 8px;">✕</button>
            </div>
          `).join("")}

          <div class="task-add">
            <input type="text" placeholder="Новая задача..."
              value="${state.newTaskText}"
              onchange="app.setNewTask(this.value)"
              onkeypress="if(event.key==='Enter') app.addTask()">
            <button class="btn primary" onclick="app.addTask()">+</button>
          </div>

          ${doneTasks.length > 0 ? `
            <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid #1d2a40;">
              <div style="font-size: 11px; color: #6d7f9b; margin-bottom: 8px;">Завершено (${doneTasks.length})</div>
              ${doneTasks.map(t => `
                <div class="task done">
                  <input type="checkbox" class="task-check on" checked onchange="app.toggleTask('${t.id}')">
                  <div class="task-title">${t.text}</div>
                </div>
              `).join("")}
            </div>
          ` : ""}
        </div>
      `;
    }

    // ============ APP API ============
    window.app = {
      switchTab(tab) {
        state.tab = tab;
        render();
      },
      addPatient,
      selectPatient,
      openVitEdit() {
        openVitEdit();
        render();
      },
      cancelVitEdit() {
        state.showVitEdit = false;
        render();
      },
      setVitForm(field, value) {
        state.vitForm[field] = value;
      },
      updatePatientVitals() {
        updatePatientVitals();
      },
      addTask,
      toggleTask,
      toggleTaskUrgent,
      deleteTask,
      setNewTask(val) {
        state.newTaskText = val;
      },
    };

    // ============ INITIALIZATION ============
    loadData();
  </script>
</body>
</html>
