<body>
<div id="app"><div class="empty">Загрузка…</div></div>
<div id="toast-slot"></div>

<script>
"use strict";

/* ================= Telegram ================= */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#0d1420"); tg.setBackgroundColor("#0d1420"); } catch (e) {} }

function ask(msg) {
  return new Promise((res) => {
    if (tg && typeof tg.showConfirm === "function" && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) {
      try { tg.showConfirm(msg, (ok) => res(!!ok)); return; } catch (e) {}
    }
    res(window.confirm(msg));
  });
}

/* ================= Хранилище =================
   В Telegram — CloudStorage (синхронизируется между устройствами через аккаунт TG).
   В обычном браузере — localStorage.
   Значения >1900 символов режутся на части (лимит CloudStorage — 4096 байт). */
const CHUNK = 1900;

const cloudRaw = {
  get: (k) => new Promise((res) => { try { tg.CloudStorage.getItem(k, (e, v) => res(e ? null : (v || null))); } catch (err) { res(null); } }),
  set: (k, v) => new Promise((res) => { try { tg.CloudStorage.setItem(k, v, (e, ok) => res(!e && !!ok)); } catch (err) { res(false); } }),
  del: (k) => new Promise((res) => { try { tg.CloudStorage.removeItem(k, () => res(true)); } catch (err) { res(false); } }),
  keys: () => new Promise((res) => { try { tg.CloudStorage.getKeys((e, ks) => res(e ? [] : (ks || []))); } catch (err) { res([]); } }),
};
const localRaw = {
  get: async (k) => { try { const v = localStorage.getItem(k); return v === null ? null : v; } catch (e) { return null; } },
  set: async (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del: async (k) => { try { localStorage.removeItem(k); return true; } catch (e) { return false; } },
  keys: async () => { try { return Object.keys(localStorage); } catch (e) { return []; } },
};

let backend = localRaw;
let backendName = "браузер (localStorage)";
let chunking = false;

const st = {
  onFail: null,
  async get(key) {
    const head = await backend.get(key);
    if (head === null) return null;
    if (chunking && head.startsWith("@C:")) {
      const n = parseInt(head.slice(3), 10) || 0;
      let out = "";
      for (let i = 0; i < n; i++) {
        const part = await backend.get(key + "@" + i);
        if (part === null) return null;
        out += part;
      }
      return out;
    }
    return head;
  },
  async set(key, val) {
    let ok;
    if (chunking && val.length > CHUNK) {
      const old = await backend.get(key);
      const oldN = old && old.startsWith("@C:") ? parseInt(old.slice(3), 10) || 0 : 0;
      const n = Math.ceil(val.length / CHUNK);
      ok = true;
      for (let i = 0; i < n; i++) {
        ok = (await backend.set(key + "@" + i, val.slice(i * CHUNK, (i + 1) * CHUNK))) && ok;
      }
      ok = (await backend.set(key, "@C:" + n)) && ok;
      for (let i = n; i < oldN; i++) await backend.del(key + "@" + i);
    } else {
      const old = chunking ? await backend.get(key) : null;
      ok = await backend.set(key, val);
      if (chunking && old && old.startsWith("@C:")) {
        const oldN = parseInt(old.slice(3), 10) || 0;
        for (let i = 0; i < oldN; i++) await backend.del(key + "@" + i);
      }
    }
    if (!ok && st.onFail) st.onFail(key);
    return ok;
  },
  async del(key) {
    const old = await backend.get(key);
    if (chunking && old && old.startsWith("@C:")) {
      const n = parseInt(old.slice(3), 10) || 0;
      for (let i = 0; i < n; i++) await backend.del(key + "@" + i);
    }
    return backend.del(key);
  },
  async keys(prefix) {
    const all = await backend.keys();
    return all.filter((k) => k.startsWith(prefix) && k.indexOf("@") === -1);
  },
};

async function initBackend() {
  if (tg && tg.CloudStorage && tg.initData && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) {
    const ok = await cloudRaw.set("__probe", String(Date.now()));
    if (ok) { backend = cloudRaw; backendName = "облако Telegram — синхронизируется между устройствами"; chunking = true; return true; }
  }
  backend = localRaw; chunking = false;
  backendName = "браузер (localStorage) — данные хранятся на этом устройстве";
  return localRaw.set("__probe", String(Date.now()));
}

/* ================= Утилиты ================= */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayKey = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const daysSince = (k) => { if (!k) return null; const a = new Date(k + "T00:00:00"), b = new Date(todayKey() + "T00:00:00"); return Math.round((b - a) / 864e5) + 1; };
const nowTime = () => { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };

function vitalAlert(v) {
  if (!v) return {};
  const hr = parseFloat(v.hr), rr = parseFloat(v.rr), spo2 = parseFloat(v.spo2);
  let sys = NaN;
  if (v.bp) { const m = String(v.bp).match(/(\d+)/); if (m) sys = parseFloat(m[1]); }
  return {
    bp: !isNaN(sys) && (sys < 90 || sys > 180),
    hr: !isNaN(hr) && (hr < 45 || hr > 120),
    rr: !isNaN(rr) && (rr > 24 || rr < 8),
    spo2: !isNaN(spo2) && spo2 < 90,
  };
}

const DEFAULT_PARAMS = [
  { label: "СрАД", ph: "70" }, { label: "ЦВД", ph: "8" }, { label: "T°", ph: "36.6" },
  { label: "Диурез", ph: "мл/ч" }, { label: "Лактат", ph: "1.2" }, { label: "Глюкоза", ph: "5.5" },
];
const LEGACY_KEYS = { map: "СрАД", cvp: "ЦВД", temp: "T°", diur: "Диурез", lact: "Лактат", glu: "Глюкоза" };
const normExtra = (extra) => {
  const out = {};
  for (const k in (extra || {})) { const v = extra[k]; if (v) out[LEGACY_KEYS[k] || k] = v; }
  return out;
};
const INFUSION_CHIPS = ["Норадреналин", "Добутамин", "Дофамин", "Адреналин", "Гепарин", "Нитроглицерин", "Кордарон", "Фуросемид", "Инсулин"];
const LOG_CAP = 300;

/* ================= Состояние ================= */
const S = {
  patients: null, tasks: [], params: DEFAULT_PARAMS.slice(),
  filter: "all", sync: false, syncMode: null, storageOk: true,
};
const ui = { vitEdit: new Set(), extraOpen: new Set(), paramAdd: new Set(), dyn: new Set(),
  inf: new Set(), noteEdit: new Set(), menu: new Set(), editP: new Set(), done: new Set() };
const logs = new Map(); // pid -> array|null
let refocusSel = null;
let toastTimer = null;

function say(msg) {
  const slot = document.getElementById("toast-slot");
  slot.innerHTML = '<div class="toast' + (msg.indexOf("⚠") === 0 ? " err" : "") + '">' + esc(msg) + "</div>";
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { slot.innerHTML = ""; }, 2500);
}

async function saveKey(key, value) {
  let ok = await st.set(key, value);
  if (!ok) { await new Promise((r) => setTimeout(r, 600)); ok = await st.set(key, value); }
  if (ok) S.storageOk = true;
  return ok;
}
async function persistPatients(note) {
  const ok = await saveKey("patients", JSON.stringify(S.patients));
  say(ok ? (note || "Сохранено ✓") : "⚠ Не сохранилось — сделайте экспорт (⇅)");
}
async function persistTasks() {
  const ok = await saveKey("tasks", JSON.stringify(S.tasks));
  if (!ok) say("⚠ Задача не сохранилась");
}
async function persistParams() { await saveKey("custom_vitals", JSON.stringify(S.params)); }

async function loadAll() {
  const p = await st.get("patients"), t = await st.get("tasks"), cv = await st.get("custom_vitals");
  try { S.patients = p ? JSON.parse(p) : []; } catch (e) { S.patients = []; }
  try { S.tasks = t ? JSON.parse(t) : []; } catch (e) { S.tasks = []; }
  try { if (cv) S.params = JSON.parse(cv); } catch (e) {}
  logs.clear();
}

/* ================= Экспорт / импорт ================= */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      return true;
    } catch (e2) { return false; }
  }
}
async function buildExport() {
  const dump = { app: "cardiodoc-lite", version: 1, exportedAt: new Date().toISOString(), data: {} };
  for (const k of ["patients", "tasks", "custom_vitals"]) { const v = await st.get(k); if (v) dump.data[k] = v; }
  for (const k of await st.keys("vitlog:")) { const v = await st.get(k); if (v) dump.data[k] = v; }
  return JSON.stringify(dump);
}
async function applyImport(text) {
  let dump;
  try { dump = JSON.parse(text); } catch (e) { return { ok: false, msg: "Не удалось прочитать: это не похоже на данные экспорта" }; }
  if (!dump || !dump.data) return { ok: false, msg: "В тексте нет данных экспорта" };
  let n = 0;
  for (const k in dump.data) { if (await st.set(k, dump.data[k])) n++; }
  return { ok: true, msg: "Загружено разделов: " + n };
}

/* ================= Разметка ================= */
function vitCell(cls, label, val, alert) {

    '</span><span class="vit-val">' + esc(val || "—") + "</span></div>";
}

    '<div class="vit-time">' + esc(v && v.at ? v.at : "ввести") + "</div></div>";

    else {

function noteHtml(p) {

function tasksHtml(p) {
  const pid = p.id;
  const my = S.tasks.filter((t) => t.patientId === pid);
  const open = my.filter((t) => !t.done).sort((a, b) => (b.priority ? 1 : 0) - (a.priority ? 1 : 0));
  const done = my.filter((t) => t.done);
  let h = '<div class="tasks">';
  for (const t of open) {
    h += '<div class="task' + (t.priority ? " urgent" : "") + '">' +
      '<button class="task-check" data-a="task-toggle" data-id="' + t.id + '"></button>' +
      '<span class="task-title" data-a="task-toggle" data-id="' + t.id + '">' + esc(t.title) + "</span>" +
      '<button class="task-pri' + (t.priority ? " on" : "") + '" data-a="task-pri" data-id="' + t.id + '">!</button></div>';
  }
  h += '<div class="task-add"><input id="task-in-' + pid + '" placeholder="Новая задача…" data-enter="task-add" data-pid="' + pid + '">' +
    '<button class="btn small" data-a="task-add" data-pid="' + pid + '">+</button></div>';
  if (done.length) {
    h += '<div class="task-done-block"><button class="task-done-toggle" data-a="done-toggle" data-pid="' + pid + '">✓ выполнено: ' + done.length + " " + (ui.done.has(pid) ? "▴" : "▾") + "</button>";
    if (ui.done.has(pid)) {
      for (const t of done) {
        h += '<div class="task done"><button class="task-check on" data-a="task-toggle" data-id="' + t.id + '"></button>' +
          '<span class="task-title">' + esc(t.title) + "</span></div>";
      }
      h += '<button class="btn ghost tiny" data-a="done-clear" data-pid="' + pid + '">Очистить выполненные</button>';
    }
    h += "</div>";
  }
  h += "</div>";
  return h;
}

    '<div class="card-head"><div class="card-title"><span class="fio">' + esc(p.fio) + "</span>" +
    '<span class="meta">' + esc((p.room ? "пал. " + p.room : "") + (days ? (p.room ? " · " : "") + days + "-е сут." : "")) + "</span></div>" +
    '<div class="card-badges">' +
    (openCount ? '<span class="badge' + (urgentCount ? " urgent" : "") + '">' + openCount + "</span>" : "") +

    h += '<div class="card-menu"><input id="ep-fio-' + pid + '" value="' + esc(p.fio) + '" placeholder="ФИО">' +
      '<input id="ep-room-' + pid + '" value="' + esc(p.room || "") + '" placeholder="Палата">' +

      '<button class="btn primary" data-a="editp-save" data-pid="' + pid + '">Сохранить</button></div></div>';

function syncHtml() {
  let h = '<div class="sync"><div class="sync-head"><span class="sec-title">Перенос данных / резервная копия</span>' +
    '<button class="sec-add" data-a="sync-close">×</button></div>' +
    '<div class="sync-btns"><button class="btn primary" data-a="exp">Экспорт → скопировать</button>' +
    '<button class="btn ghost" data-a="imp-mode">Импорт ← вставить</button></div>';
  if (S.syncMode) {
    h += '<textarea id="sync-text" rows="4"' + (S.syncMode === "export" ? " readonly" : "") +
      ' placeholder="' + (S.syncMode === "import" ? "Вставьте сюда текст экспорта…" : "") + '"></textarea>';
    if (S.syncMode === "import") h += '<button class="btn primary" data-a="imp-load">Загрузить</button>';
  }
  h += '<div class="sync-msg" id="sync-msg"></div>' +
    '<div class="sync-hint">Экспорт совместим со старыми версиями CardioDoc — вставьте сюда текст экспорта из артефакта, и всё перенесётся.</div></div>';

}

function render() {
  const app = document.getElementById("app");
  const openTotal = S.tasks.filter((t) => !t.done).length;
  const urgentTotal = S.tasks.filter((t) => !t.done && t.priority).length;
  let h = '<header class="top"><div class="brand">CardioDoc <span class="lite">Lite</span></div><div class="counters">' +
    '<button class="chip' + (S.filter === "all" ? " on" : "") + '" data-a="filter-all">Задачи: ' + openTotal + "</button>" +
    '<button class="chip red' + (S.filter === "urgent" ? " on" : "") + '" data-a="filter-urgent"' + (urgentTotal ? "" : " disabled") + ">Срочно: " + urgentTotal + "</button>" +
    '<button class="chip' + (S.sync ? " on" : "") + '" data-a="sync-toggle" title="Перенос данных">⇅</button></div></header>';

  if (!S.storageOk) {
    h += '<div class="banner warn">Хранилище недоступно — введённое не сохранится после закрытия. Держите резервную копию через «⇅».</div>';
  }
  if (S.sync) h += syncHtml();

  if (S.patients === null) { h += '<div class="empty">Загрузка…</div>'; app.innerHTML = h; return; }

  const shown = S.patients.filter((p) => S.filter === "all" ? true : S.tasks.some((t) => t.patientId === p.id && !t.done && t.priority));
  h += '<main class="list">';
  for (const p of shown) h += cardHtml(p);
  if (!S.patients.length && !ui.menu.has("__new")) h += '<div class="empty">Пациентов пока нет.<br>Добавьте первого — кнопка ниже.</div>';
  if (S.filter === "urgent" && S.patients.length && !shown.length) h += '<div class="empty">Срочных задач нет 🎉</div>';

  if (ui.menu.has("__new")) {
    h += '<div class="card new-form"><div class="card-title"><span class="fio">Новый пациент</span></div>' +
      '<input id="np-fio" placeholder="ФИО" data-enter="np-save"><input id="np-room" placeholder="Палата" data-enter="np-save">' +
      '<div class="vit-edit-actions"><button class="btn ghost" data-a="np-cancel">Отмена</button>' +
      '<button class="btn primary" data-a="np-save">Добавить</button></div></div>';
  } else {
    h += '<button class="btn add-patient" data-a="np-open">+ Пациент</button>';
  }
  h += "</main>";
  h += '<div class="storage-tag">Хранилище: ' + esc(backendName) + "</div>";
  app.innerHTML = h;

  if (refocusSel) {
    const el = document.querySelector(refocusSel);
    if (el) el.focus();
    refocusSel = null;
  }
}

/* ================= Действия ================= */
const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
const findP = (pid) => S.patients.find((x) => x.id === pid);

async function loadLog(pid) {
  const raw = await st.get("vitlog:" + pid);
  let arr = [];
  try { arr = raw ? JSON.parse(raw) : []; } catch (e) {}
  logs.set(pid, arr);
}

const actions = {
  "filter-all": () => { S.filter = "all"; render(); },
  "filter-urgent": () => { S.filter = "urgent"; render(); },
  "sync-toggle": () => { S.sync = !S.sync; S.syncMode = null; render(); },
  "sync-close": () => { S.sync = false; S.syncMode = null; render(); },

  "exp": async () => {
    S.syncMode = "export"; render();
    const json = await buildExport();
    const ta = document.getElementById("sync-text");
    if (ta) { ta.value = json; ta.onfocus = () => ta.select(); }
    const ok = await copyText(json);
    const m = document.getElementById("sync-msg");
    if (m) m.textContent = ok ? "Скопировано в буфер обмена ✓" : "Скопируйте текст выше вручную";
  },
  "imp-mode": () => { S.syncMode = "import"; render(); },
  "imp-load": async () => {
    const ta = document.getElementById("sync-text");
    const text = ta ? ta.value.trim() : "";
    if (!text) return;
    if (!(await ask("Заменить данные на этом устройстве данными из вставленного текста?"))) return;
    const r = await applyImport(text);
    if (r.ok) { await loadAll(); say(r.msg + " ✓"); S.sync = false; S.syncMode = null; render(); }
    else { const m = document.getElementById("sync-msg"); if (m) m.textContent = r.msg; }
  },

  "np-open": () => { ui.menu.add("__new"); refocusSel = "#np-fio"; render(); },
  "np-cancel": () => { ui.menu.delete("__new"); render(); },
  "np-save": async () => {
    const fio = val("np-fio"); if (!fio) return;
    const p = { id: uid(), fio, room: val("np-room"), admitDate: todayKey(), tags: [], vitals: null, infusions: [], note: "" };
    S.patients.push(p);
    ui.menu.delete("__new"); S.filter = "all"; render();
    await persistPatients("Пациент «" + fio.split(" ")[0] + "» сохранён ✓");
  },

  "menu-toggle": (d) => { ui.menu.has(d.pid) ? ui.menu.delete(d.pid) : ui.menu.add(d.pid); ui.editP.delete(d.pid); render(); },
  "editp-open": (d) => { ui.editP.add(d.pid); render(); },
  "editp-cancel": (d) => { ui.editP.delete(d.pid); ui.menu.delete(d.pid); render(); },
  "editp-save": async (d) => {
    const p = findP(d.pid); if (!p) return;
    const fio = val("ep-fio-" + d.pid); if (!fio) return;
    p.fio = fio; p.room = val("ep-room-" + d.pid);
    ui.editP.delete(d.pid); ui.menu.delete(d.pid); render();
    await persistPatients();
  },
  "del-patient": async (d) => {
    const p = findP(d.pid); if (!p) return;
    if (!(await ask("Удалить пациента «" + p.fio + "» и его задачи?"))) return;
    S.patients = S.patients.filter((x) => x.id !== d.pid);
    S.tasks = S.tasks.filter((t) => t.patientId !== d.pid);
    st.del("vitlog:" + d.pid);
    render();
    await persistPatients("Пациент удалён"); await persistTasks();
  },

  "vit-open": (d) => { ui.vitEdit.add(d.pid); render(); },
  "vit-cancel": (d) => { ui.vitEdit.delete(d.pid); ui.extraOpen.delete(d.pid); ui.paramAdd.delete(d.pid); render(); },
  "extra-open": (d) => { ui.extraOpen.add(d.pid); render(); },
  "param-add-open": (d) => { ui.paramAdd.add(d.pid); refocusSel = "#np-param-" + d.pid; render(); },
  "param-add-save": async (d) => {
    const name = val("np-param-" + d.pid);
    ui.paramAdd.delete(d.pid);
    if (name && !S.params.some((p) => p.label.toLowerCase() === name.toLowerCase())) {
      S.params.push({ label: name, ph: "" });
      await persistParams();
    }
    render();
  },
  "param-del": async (d, ev) => {
    ev.stopPropagation();
    S.params = S.params.filter((p) => p.label !== d.label);
    await persistParams(); render();
  },
  "vit-save": async (d) => {
    const p = findP(d.pid); if (!p) return;
    const extra = {};
    document.querySelectorAll('.vit-edit[data-pid="' + d.pid + '"] .xin').forEach((inp) => {
      const v = inp.value.trim();
      if (v) extra[inp.getAttribute("data-label")] = v;
    });
    /* значения показателей, удалённых из настроек — не теряем */
    const old = normExtra(p.vitals && p.vitals.extra);
    for (const k in old) { if (!(k in extra) && !S.params.some((pp) => pp.label === k)) extra[k] = old[k]; }
    const sys = val("sys-" + d.pid), dia = val("dia-" + d.pid);
    const bp = sys || dia ? sys + (dia ? "/" + dia : "") : "";
    const entry = { id: uid(), d: todayKey(), t: nowTime(), bp, hr: val("hr-" + d.pid), rr: val("rr-" + d.pid), spo2: val("spo2-" + d.pid), extra };
    p.vitals = { bp: entry.bp, hr: entry.hr, rr: entry.rr, spo2: entry.spo2, extra, at: entry.t };
    ui.vitEdit.delete(d.pid); ui.extraOpen.delete(d.pid); ui.paramAdd.delete(d.pid);
    if (!logs.has(d.pid)) await loadLog(d.pid);
    const arr = logs.get(d.pid) || [];
    arr.unshift(entry);
    if (arr.length > LOG_CAP) arr.length = LOG_CAP;
    logs.set(d.pid, arr);
    render();
    const ok1 = await saveKey("vitlog:" + d.pid, JSON.stringify(arr));
    await persistPatients(ok1 ? "Измерение сохранено ✓" : "⚠ Динамика не сохранилась");
  },
  "dyn-toggle": async (d) => {
    if (ui.dyn.has(d.pid)) { ui.dyn.delete(d.pid); render(); return; }
    ui.dyn.add(d.pid); render();
    if (!logs.has(d.pid)) { await loadLog(d.pid); render(); }
  },
  "dyn-del": async (d) => {
    const arr = (logs.get(d.pid) || []).filter((x) => x.id !== d.id);
    logs.set(d.pid, arr);
    render();
    await saveKey("vitlog:" + d.pid, JSON.stringify(arr));
  },

  "inf-toggle": (d) => { ui.inf.has(d.pid) ? ui.inf.delete(d.pid) : ui.inf.add(d.pid); render(); },
  "inf-chip": (d) => { const el = document.getElementById("inf-name-" + d.pid); if (el) { el.value = d.name; const r = document.getElementById("inf-rate-" + d.pid); if (r) r.focus(); } },
  "inf-add": async (d) => {
    const p = findP(d.pid); if (!p) return;
    const name = val("inf-name-" + d.pid); if (!name) return;
    p.infusions = p.infusions || [];
    p.infusions.push({ id: uid(), name, rate: val("inf-rate-" + d.pid) });
    ui.inf.delete(d.pid); render();
    await persistPatients();
  },
  "inf-del": async (d) => {
    const p = findP(d.pid); if (!p) return;
    p.infusions = (p.infusions || []).filter((i) => i.id !== d.id);
    render();
    await persistPatients();
  },

  "note-open": (d) => { ui.noteEdit.add(d.pid); refocusSel = "#note-" + d.pid; render(); },
  "note-cancel": (d) => { ui.noteEdit.delete(d.pid); render(); },
  "note-save": async (d) => {
    const p = findP(d.pid); if (!p) return;
    const el = document.getElementById("note-" + d.pid);
    p.note = el ? el.value.trim() : "";
    ui.noteEdit.delete(d.pid); render();
    await persistPatients();
  },

  "task-add": async (d) => {
    const title = val("task-in-" + d.pid); if (!title) return;
    S.tasks.push({ id: uid(), patientId: d.pid, title, done: false, priority: false, createdAt: Date.now() });
    refocusSel = "#task-in-" + d.pid;
    render();
    await persistTasks();
  },
  "task-toggle": async (d) => {
    const t = S.tasks.find((x) => x.id === d.id); if (!t) return;
    t.done = !t.done; render();
    await persistTasks();
  },
  "task-pri": async (d) => {
    const t = S.tasks.find((x) => x.id === d.id); if (!t) return;
    t.priority = !t.priority; render();
    await persistTasks();
  },
  "done-toggle": (d) => { ui.done.has(d.pid) ? ui.done.delete(d.pid) : ui.done.add(d.pid); render(); },
  "done-clear": async (d) => {
    S.tasks = S.tasks.filter((t) => !(t.patientId === d.pid && t.done));
    ui.done.delete(d.pid); render();
    await persistTasks();
  },
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const a = el.getAttribute("data-a");
  const d = { pid: el.getAttribute("data-pid"), id: el.getAttribute("data-id"), label: el.getAttribute("data-label"), name: el.getAttribute("data-name") };
  if (actions[a]) actions[a](d, ev);
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter") return;
  const el = ev.target.closest("[data-enter]");
  if (!el) return;
  ev.preventDefault();
  const a = el.getAttribute("data-enter");
  const d = { pid: el.getAttribute("data-pid") };
  if (actions[a]) actions[a](d, ev);
});

/* ================= Запуск ================= */
(async () => {
  S.storageOk = await initBackend();
  await loadAll();
  render();
})();
</script>
</body>
</html>
